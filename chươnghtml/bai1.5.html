<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trình bày bảng</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Bảng điểm học phần môn học</h2>
    <table>
        <tr>
            <th>STT</th>
            <th>Môn học</th>
            <th>Số tín chỉ</th>
            <th>Điểm số</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Kỹ thuật lập trình (C++)</td>
            <td>3</td>
            <td>A</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Thiết kế Web</td>
            <td>2</td>
            <td>A</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Toán rời rạc</td>
            <td>3</td>
            <td>B+</td>
        </tr>
    </table>
</body>
</html>
